name: Android APK

on:
  push:
    branches:
      - don-libarti-controls
    paths:
      - "android/**"
      - "runtime/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: android
        env:
          PES17_BUILD_SHA: ${{ github.sha }}
          PES17_BUILD_STAMP: ${{ github.run_number }}
          PES17_VERSION_NAME: "0.1.2-controls"
          PES17_NATIVE_OPTIMISATION: "-O2"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Don-Libarti-PES17-controls-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
